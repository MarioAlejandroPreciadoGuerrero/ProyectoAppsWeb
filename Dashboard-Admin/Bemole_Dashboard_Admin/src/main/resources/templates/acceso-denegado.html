<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bemolé Admin — Acceso denegado</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/styles/admin.css}">
</head>
<body class="admin-auth-body">
  <main class="admin-status-card">
    <div class="admin-status-card__icon">🔒</div>
    <p class="admin-page-header__eyebrow">Seguridad</p>
    <h1>Acceso denegado</h1>
    <p>Tu sesión no tiene permisos para acceder a este recurso administrativo.</p>
    <div class="admin-status-card__actions">
      <a class="btn btn-primary" th:href="@{/admin}">Volver al panel</a>
      <form th:action="@{/logout}" method="post">
        <button class="btn btn-ghost" type="submit">Cerrar sesión</button>
      </form>
    </div>
  </main>
</body>
</html>
