<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bemolé Admin — Error</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/styles/admin.css}">
</head>
<body class="admin-auth-body">
  <main class="admin-status-card">
    <div class="admin-status-card__icon">⚠️</div>
    <p class="admin-page-header__eyebrow">Error</p>
    <h1>No fue posible completar la solicitud</h1>
    <p th:if="${status}" th:text="${'Código HTTP: ' + status}">Código HTTP</p>
    <p th:if="${message}" th:text="${message}">Ocurrió un error inesperado.</p>
    <div class="admin-status-card__actions">
      <a class="btn btn-primary" th:href="@{/admin}">Ir al panel</a>
      <a class="btn btn-ghost" th:href="@{/login}">Ir al acceso</a>
    </div>
  </main>
</body>
</html>
