<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${edicion} ? 'Bemolé Admin — Editar categoría' : 'Bemolé Admin — Nueva categoría'">Bemolé Admin — Categoría</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/styles/admin.css}">
</head>
<body class="admin-body">
  <div th:replace="~{admin/fragments/topbar :: topbar}"></div>
  <div class="admin-shell">
    <div th:replace="~{admin/fragments/sidebar :: sidebar('categorias')}"></div>

    <main class="admin-content">
      <header class="admin-page-header">
        <div>
          <p class="admin-page-header__eyebrow">Catálogo</p>
          <h1 class="admin-page-header__title" th:text="${edicion} ? 'Editar categoría' : 'Nueva categoría'">Categoría</h1>
          <p class="admin-page-header__subtitle">El nombre debe ser único dentro del catálogo.</p>
        </div>
        <a class="btn btn-ghost" th:href="@{/admin/categorias}">← Volver</a>
      </header>

      <div class="admin-alert admin-alert--error" th:if="${error}"><span>!</span><span th:text="${error}">No fue posible guardar la categoría.</span></div>

      <section class="admin-form-card admin-form-card--narrow">
        <form th:object="${categoria}" th:action="${edicion} ? @{/admin/categorias/{id}(id=${categoriaId})} : @{/admin/categorias}" method="post">
          <input th:if="${edicion}" type="hidden" name="_method" value="put">

          <div class="admin-form-grid">
            <div class="field field--full">
              <label for="nombre">Nombre</label>
              <input id="nombre" type="text" th:field="*{nombre}" maxlength="100" placeholder="Ej. Guitarras">
              <small class="field-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}">Nombre inválido</small>
            </div>

            <div class="field field--full">
              <label for="descripcion">Descripción</label>
              <textarea id="descripcion" th:field="*{descripcion}" rows="5" maxlength="500" placeholder="Describe qué productos pertenecen a esta categoría."></textarea>
              <small class="field-error" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}">Descripción inválida</small>
            </div>
          </div>

          <div class="admin-form-actions">
            <a class="btn btn-ghost" th:href="@{/admin/categorias}">Cancelar</a>
            <button class="btn btn-primary" type="submit" th:text="${edicion} ? 'Guardar cambios' : 'Crear categoría'">Guardar</button>
          </div>
        </form>
      </section>
    </main>
  </div>
</body>
</html>
