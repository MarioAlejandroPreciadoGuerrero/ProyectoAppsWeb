<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Spa Sewa Ta'a - Registro de Cuenta">
    <meta name="keywords" content="spa, tratamiento, reserva, registro, crear cuenta">
    <meta name="author" content="Equipo Azul">
    <meta name="robots" content="index, follow">
    <title>Spa Sewa Ta'a - Registrarse</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Belgrano&family=Bellota:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
<header class="topbar">
    <input type="checkbox" id="menu-toggle" class="menu-toggle" aria-label="Abrir menú">
    <label for="menu-toggle" class="menu-button" aria-label="Menú">
        <span></span>
        <span></span>
        <span></span>
    </label>
    <a href="index.html" class="logo">
        <img src="img/logo_dark.png" alt="Logo Spa Sewa Ta'a">
    </a>
    <span class="topbar-spacer"></span>

    <nav class="menu-desplegable" aria-label="Menú principal">
        <div class="menu-top">
            <a href="index.html" class="menu-logo">
                <img src="img/logo_dark.png" alt="Logo Spa Sewa Ta'a">
            </a>
        </div>
        <ul>
            <li><a href="#">Reservaciones</a></li>
            <li><a href="#">Mi perfil</a></li>
        </ul>
    </nav>
</header>

<main class="autenticacion-principal">
    <div class="tarjeta-autenticacion">
        <div class="encabezado-autenticacion">
            <img src="img/logo_dark.png" alt="Logo Spa Sewa Ta'a">
        </div>

        <div class="cuerpo-autenticacion">
            <div class="pestanias-autenticacion">
                <a href="login.html" class="pestania-autenticacion">Iniciar Sesión</a>
                <a href="register.html" class="pestania-autenticacion activa">Registrarse</a>
            </div>

            <h1 class="titulo-autenticacion">Crea tu cuenta</h1>
            <p class="subtitulo-autenticacion">Únete a Spa Sewa Ta'a y renueva tu energía.</p>

            <form action="#" method="post">
                <div class="grupo-formulario">
                    <label for="nombre" class="etiqueta-formulario">Nombre Completo</label>
                    <input type="text" id="nombre" name="nombre" class="campo-formulario" placeholder="Ej. Rogelio Barceló" required>
                </div>

                <div class="grupo-formulario">
                    <label for="correo" class="etiqueta-formulario">Correo Electrónico</label>
                    <input type="email" id="correo" name="correo" class="campo-formulario" placeholder="correo@ejemplo.com" required>
                </div>

                <div class="grupo-formulario">
                    <label for="telefono" class="etiqueta-formulario">Teléfono</label>
                    <input type="tel" id="telefono" name="telefono" class="campo-formulario" placeholder="+52 (644) 000-0000" required>
                </div>

                <div class="grupo-formulario">
                    <label for="fechaNacimiento" class="etiqueta-formulario">Fecha de nacimiento</label>
                    <input type="date" id="fechaNacimiento" name="fechaNacimiento" class="campo-formulario" required>
                </div>

                <div class="grupo-formulario">
                    <label for="contrasenia" class="etiqueta-formulario">Contraseña</label>
                    <input type="password" id="contrasenia" name="contrasenia" class="campo-formulario" placeholder="••••••••••••" required>
                </div>

                <button type="submit" class="boton-autenticacion">Crear Cuenta</button>
            </form>
        </div>
    </div>
</main>

<footer class="footer">
    <img src="img/logo_light.png" alt="Logo Spa Sewa Ta'a">
    <p>Spa Sewa Ta'a</p>
    <small>© Equipo Azul</small>
</footer>
</body>
</html>
