<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Spa Sewa Ta'a - Pagar servicio">
  <meta name="keywords" content="spa, tratamiento, reserva, servicio">
  <meta name="author" content="Equipo Azul">
  <meta name="robots" content="index, follow">
  <title>Spa Sewa Ta'a - Pagar servicio</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Belgrano&family=Bellota:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
  <header class="topbar">
    <!-- menu hamburguesa animado (pieza AGENTS.md): el checkbox controla el boton y el ul -->
    <input type="checkbox" id="menu-toggle" class="menu-toggle" aria-label="Abrir menú">
    <label for="menu-toggle" class="menu-button" aria-label="Menú">
      <span></span>
      <span></span>
      <span></span>
    </label>
    <a href="#" class="logo">
      <img src="img/logo_dark.png" alt="Logo Spa Sewa Ta'a">
    </a>
    <span class="topbar-spacer"></span>

    <!-- menu desplegable -->
    <nav class="menu-desplegable" aria-label="Menú principal">
      <div class="menu-top">
        <a href="#" class="menu-logo">
          <img src="img/logo_dark.png" alt="Logo Spa Sewa Ta'a">
        </a>
      </div>
      <ul>
        <li><a href="#">Reservaciones</a></li>
        <li><a href="#">Mi perfil</a></li>
      </ul>
    </nav>
  </header>

  <main class="pago">
    <div class="cinta">Tratamientos faciales</div>

    <div class="contenedor">
      <h2 class="subtitulo">Resumen del servicio</h2>

      <!-- plantilla con datos luego le ponen fragmentos -->
      <div class="resumen-card resumen-amplio">
        <div class="fecha-badge">JUE<br>08</div>
        <div class="resumen-tipo">
          <strong>Tratamientos faciales</strong>
          Mascarilla
        </div>
        <div class="resumen-info">
          Cuarto 3<br>
          9:00am - 10:30am<br>
          $100 mx<br>
          60min
        </div>
      </div>

      <hr class="divisor">

      <div class="pago-columnas">
        <div class="pago-col">
          <h2 class="subtitulo">Datos del cliente</h2>
          <div class="dato-card">
            Nombre: nombre<br>
            Edad: 18
          </div>
        </div>

        <!-- si quieren agregar un metodo de pago agreguen un a y le pueden poner imagen adentro-->
        <div class="pago-col">
          <h2 class="subtitulo">Formas de pago</h2>
          <a href="#" class="paypal-btn">
            <img src="img/metodoPaypal.png" alt="Pagar con PayPal">
          </a>
          <a href="#" class="pago-btn">Pago en efectivo</a>
        </div>
      </div>

      <div class="cta-wrap">
        <a href="#" class="btn-grande btn-confirmar">Confirmar</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <img src="img/logo_light.png" alt="Logo Spa Sewa Ta'a">
    <p>Spa Sewa Ta'a</p>
    <small>© Equipo Azul</small>
  </footer>
</body>
</html>
