<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layouts/layout :: layout(~{::title}, ~{::section})}">
<head>
    <title>Resumen de Ocupación - Spa Sewa Ta'a</title>
</head>
<body>
<section class="admin-view">
    <div class="section-banner">
        <h2>Resumen de Ocupación</h2>
    </div>

    <!-- Tarjetas de Métricas -->
    <div class="metrics-grid">
        <div class="metric-card">
            <span class="metric-value" th:text="${porcentajeOcupacion + '%'}">0%</span>
            <span class="metric-label">Horarios Ocupados</span>
        </div>
        <div class="metric-card">
            <span class="metric-value" th:text="${totalCanceladas}">0</span>
            <span class="metric-label">Reservaciones Canceladas</span>
        </div>
        <div class="metric-card">
            <span class="metric-value" th:text="${totalConfirmadas}">0</span>
            <span class="metric-label">Citas Confirmadas</span>
        </div>
    </div>

    <!-- Catálogo / Lista de Servicios Solicitados -->
    <div class="card">
        <h3 class="card-title">Servicios Disponibles en el Panel</h3>
        <div class="table-responsive">
            <table class="data-table">
                <thead>
                <tr>
                    <th>Servicio o Espacio</th>
                    <th>Categoría</th>
                    <th>Precio Base</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="servTop : ${serviciosPopulares}">
                    <td th:text="${servTop.nombre}">Tratamiento Facial</td>
                    <td th:text="${servTop.categoria}">Faciales</td>
                    <td th:text="|$${#numbers.formatDecimal(servTop.precio, 1, 'COMMA', 2, 'POINT')}|">$500.00</td>
                </tr>
                <tr th:if="${#lists.isEmpty(serviciosPopulares)}">
                    <td colspan="3" style="text-align: center; color: var(--text-muted); padding: 1.5rem;">
                        No hay información de servicios cargada en el sistema.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</section>
</body>
</html>
