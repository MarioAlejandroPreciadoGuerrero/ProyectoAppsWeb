# Configuración de puerto y nombre de aplicación
server.port=8080
spring.application.name=GameVault

# Base de datos MySQL
# Editen usuario y contraseña no lo suban a git
spring.datasource.url=jdbc:mysql://localhost:3306/gamevaultdb?createDatabaseIfNotExist=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=usuario
spring.datasource.password=contrasena
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# Cloudinary
cloudinary.cloud_name=o2qgclqc
cloudinary.api_key=
cloudinary.api_secret=clave secreta de cloudinary