# Configuración de puerto y nombre de aplicación
server.port=8080
spring.application.name=SpaAppsWebs

# Base de datos MySQL
# Editen usuario y contraseña no lo suban a git
spring.datasource.url=jdbc:mysql://localhost:3306/spa?createDatabaseIfNotExist=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=usuario
spring.datasource.password=contrasenia
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# Cloudinary
cloudinary.cloud_name=nombre
cloudinary.api_key=si
cloudinary.api_secret=tambien